services:
  # Optional: a local Neo4j instance for local Neo4j Browser access / as an alternative to
  # Aura. The backend does NOT depend on this by default - it connects to whatever
  # NEO4J_URI/USERNAME/PASSWORD/DATABASE are set in backend/.env (currently a Neo4j Aura
  # cloud instance). Switch the backend to this local instance instead by setting
  # NEO4J_URI=bolt://neo4j:7687, NEO4J_USERNAME=neo4j, NEO4J_PASSWORD=ragchatbot123,
  # NEO4J_DATABASE=neo4j in backend/.env.
  neo4j:
    image: neo4j:5.24-community
    container_name: rag_chatbot_neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/ragchatbot123
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD", "wget", "-O", "/dev/null", "http://localhost:7474"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: rag_chatbot_backend
    env_file:
      - backend/.env
    environment:
      # Overrides backend/.env's Windows tesseract.exe path - the container has tesseract-ocr
      # installed on PATH (see backend/Dockerfile), so pytesseract needs no explicit path here.
      - TESSERACT_CMD=
    ports:
      - "8600:8600"
    volumes:
      - backend_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8600/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-facing URL, so leave as localhost even though the container talks to
        # "backend" internally over the Docker network - the browser can't resolve that name.
        VITE_API_BASE_URL: http://localhost:8600
    container_name: rag_chatbot_frontend
    ports:
      - "5190:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  neo4j_data:
  neo4j_logs:
  backend_data:
